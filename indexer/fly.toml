# Fly.io config for the commas indexer. Fly keeps a persistent Node
# process, which the WebSocket feed and on-chain event subscription need.
app = "commas-indexer"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  # Keep one machine always running so the WS + chain subscription persist.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
